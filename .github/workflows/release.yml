name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest

    # Add a required reviewer to this environment in repository settings to gate the
    # deploy behind a manual approval. A version released to Maven Central can never
    # be replaced or withdrawn, and the POM sets autoPublish=true, so the tag push
    # otherwise goes live unattended.
    environment: maven-central

    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH — Central rejects anything else"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # Writes ~/.m2/settings.xml with a `central` server reading these env vars,
          # and a `gpg.passphrase` server, which is the default passphraseServerId the
          # POM now relies on. server-id must match publishingServerId in the POM.
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set version from tag
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DgenerateBackupPoms=false

      # One invocation: deploy runs the full lifecycle, so the tests gate the release.
      # The `central` profile adds GPG signing and the Central publishing plugin.
      - name: Build, sign and publish to Maven Central
        run: mvn -B -ntp -P central deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$VERSION" \
            --generate-notes \
            target/block-alignment-lint-"$VERSION".jar \
            target/block-alignment-lint-"$VERSION"-sources.jar \
            target/block-alignment-lint-"$VERSION"-javadoc.jar
