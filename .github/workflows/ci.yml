name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same branch or PR makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the release target, so it has to pass there. The newer JDKs catch
        # anything that only works on the JDK the code happens to be written on.
        java: ['17', '21', '25']
    name: build (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Runs the 65 tests, including SelfCheckTest, which lints this project's own
      # sources with the rule it ships.
      - name: Verify
        run: mvn -B -ntp verify

      - name: Upload jars
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: target/*.jar
          retention-days: 7
          if-no-files-found: error
